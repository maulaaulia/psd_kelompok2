<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pastel Todo App</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->
  <aside>
    <h2 class="logo">🌸 Todo</h2>

    <nav>
      <button class="nav-btn active">🏠 Dashboard</button>
      <button class="nav-btn">📋 Tugas</button>
      <button class="nav-btn">➕ Tambah</button>
    </nav>

    <div class="bottom">
      <button class="logout">🚪 Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main>

    <!-- HEADER -->
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="user">👋 Hi, User</div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- CARD WELCOME -->
      <div class="card big">
        <h3>Selamat Datang ✨</h3>
        <p>Mulai atur tugasmu hari ini dengan lebih rapi dan produktif.</p>
      </div>

      <!-- STATS -->
      <div class="grid">
        <div class="card">
          <h4>📌 Total Tugas</h4>
          <p class="number">0</p>
        </div>

        <div class="card">
          <h4>✅ Selesai</h4>
          <p class="number">0</p>
        </div>

        <div class="card">
          <h4>⏳ Belum</h4>
          <p class="number">0</p>
        </div>
      </div>

      <!-- TASK PREVIEW -->
      <div class="card">
        <h3>Tugas Hari Ini</h3>
        <div class="empty">Belum ada tugas 😴</div>
      </div>

    </div>

  </main>

</div>
<script src="main.js"></script>
</body>
</html>

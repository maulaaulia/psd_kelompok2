<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Pastel Todo App</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <aside>
      <h2 class="logo">🌸 Todo</h2>

      <nav>
        <button class="nav-btn active" onclick="setActive(this); showHome()">🏠 Home</button>
        <button class="nav-btn" onclick="setActive(this); showDashboard()">📊 Dashboard</button>
        <button class="nav-btn" onclick="setActive(this); showTasks()">📋 Tugas</button>
        <button class="nav-btn" onclick="setActive(this); showAdd()">➕ Tambah</button>
        <button class="nav-btn" onclick="showCalendar(); setActive(this)">
          📅 Calendar
        </button>
      </nav>

      <div class="bottom">
        <button class="logout" onclick="logout()">🚪 Logout</button>
      </div>
    </aside>

    <main>

      <div class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="user" id="userName">👋 Hi, User</div>
      </div>

      <div class="content"></div>

    </main>

  </div>

  <script src="main.js"></script>
</body>

</html>
